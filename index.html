<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>TuTienda | Café de especialidad</title>
  <link rel="stylesheet" href="css/styles.css">
  <script src="js/main.js" defer></script>
</head>
<body>

  <header>
    <h1>TuTienda</h1>
    <nav>
      <ul>
        <li><a href="#productos">Productos</a></li>
        <li><a href="#pedido">Pedido</a></li>
        <li><a href="#contacto">Contacto</a></li>
      </ul>
    </nav>
  </header>

  <main>
    <section id="productos">
      <h2>Nuestros cafés</h2>
    </section>

    <section id="pedido">
      <h2>Haz tu pedido</h2>
      <form id="form-pedido" action="#" method="post">

  <label for="nombre">Nombre</label>
  <input type="text" id="nombre" name="nombre" required minlength="3">

  <label for="correo">Correo</label>
  <input type="email" id="correo" name="correo" required>

  <label for="producto">Producto</label>
  <select id="producto" name="producto" required>
    <option value="">Elige un producto</option>
    <option value="molido">Café molido</option>
    <option value="grano">Café en grano</option>
  </select>

  <label for="cantidad">Cantidad</label>
  <input type="number" id="cantidad" name="cantidad" min="1" max="10" value="1">

  <label for="comentario">Comentario (opcional)</label>
  <textarea id="comentario" name="comentario" rows="3"></textarea>

  <button type="submit">Enviar pedido</button>
  <p id="mensaje"></p>

</form>
      <h2>Haz tu pedido</h2>
    </section>
  </main>

  <figure>
  <img src="images/cafe-espresso.jpg" alt="Taza de espresso recién servido" width="400" height="300">
  <figcaption>Espresso de la casa</figcaption>
</figure>


<table>
  <caption>Lista de precios</caption>
  <thead>
    <tr>
      <th scope="col">Producto</th>
      <th scope="col">Presentación</th>
      <th scope="col">Precio</th>
    </tr>
  </thead>
  <tbody>
    <tr>
      <th scope="row">Café molido</th>
      <td>250 g</td>
      <td>S/ 22.00</td>
    </tr>
    <tr>
      <th scope="row">Café en grano</th>
      <td>500 g</td>
      <td>S/ 40.00</td>
    </tr>
  </tbody>
</table>

  <footer id="contacto">
    <p>&copy; 2026 TuTienda</p>
    <p>Aprende más sobre el origen del café en
  <a href="https://es.wikipedia.org/wiki/Caf%C3%A9" target="_blank" rel="noopener">Wikipedia</a>.
</p>
  </footer>
 





</body>
</html>
